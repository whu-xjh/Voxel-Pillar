common:
  lid_topic: "/hesai/pandar"
  imu_topic: "/alphasense/imu"
  lidar_en: 1
  ros_driver_bug_fix: false

extrin_calib:
  # Hilti-2022
  extrinsic_T: [-0.001, -0.00855, 0.055]
  extrinsic_R: [0, -1, 0, -1, 0, 0, 0, 0, -1]

  # Hilti-2023
  # extrinsic_T: [-0.006730146149038548, -0.006897049862999071, 0.049898628062256645]
  # extrinsic_R: [0.006609639848469365, -0.9999773650294649, 0.0012578115132016717,
  #               -0.9999762249571927, -0.006612093869054189, -0.0019569708811106104,
  #               0.001965243352927244, -0.0012448467359610184, -0.9999972940839232]

time_offset:
  imu_time_offset: 0.0

preprocess:
  point_filter_num: 3
  filter_size_surf: 0.1
  lidar_type: 5  # HesaiXT32
  scan_line: 32
  blind: 1

imu:
  imu_en: true
  imu_int_frame: 50
  acc_cov: 0.5
  gyr_cov: 0.01
  b_acc_cov: 0.0001
  b_gyr_cov: 0.0001

  # exp03
  # acc_cov: 0.5
  # gyr_cov: 0.5
  # b_acc_cov: 0.0001
  # b_gyr_cov: 0.0001

  # exp10
  # acc_cov: 0.2
  # gyr_cov: 0.01
  # b_acc_cov: 0.0001
  # b_gyr_cov: 0.0001

lio:
  max_iterations: 5
  dept_err: 0.02
  beam_err: 0.05
  min_eigen_value: 0.0025
  voxel_size: 0.5
  max_layer: 1 
  max_points_num: 100
  layer_init_num: [10, 5, 5, 5, 5]

  capacity: 0  # LRU cache (0 = disable)

  # plane refinements
  

intensity_fusion:
  intensity_fusion_en: true
  intensity_fusion_weight: 0.8      # constant intensity trust weight in the joint score exp(-(w_g*m_geo + w_i*m_int)) when degeneracy_adaptive_en is false
  intensity_ema_alpha: 0.5          # EMA adaptation rate of plane intensity stats, in (0,1]; higher = faster
  intensity_gate_en: false          # Intensity-based association gate (reject material-inconsistent matches)
  intensity_gate_k: 3.0             # Gate threshold in units of intensity sigma

degeneracy_adaptive:
  degeneracy_adaptive_en: true
  degeneracy_on_threshold: 0.1      # ramp lower endpoint on lambda_min/lambda_max: at or below this w_i = w_max
  degeneracy_off_threshold: 0.3     # ramp upper endpoint: at or above this w_i = w_min; must be > on
  degeneracy_weight_min: 0.0        # intensity trust floor when geometry is healthy (0 = geometry-only scoring)
  degeneracy_weight_max: 0.8        # intensity trust ceiling when fully degenerate
  degeneracy_weight_ema_alpha: 0.5  # EMA rate of the degeneracy ramp d, in (0,1]; higher = faster tracking

plane_refine_en:
  plane_refine_en: true
  init_distance_threshold: 0.1      # init_plane: drop points farther than this from the first PCA fit (m)
  plane_valid_check_en: true        # coplanar-disjoint-surface guard (2D grid DFS clustering)
  valid_check_max_layer: 1          # run the guard only on layers with index <= this (0 = root voxel only)
  valid_check_min_points_size: 10   # min retained points to run the guard
  valid_check_resolution: 4         # projection grid resolution factor
  valid_check_p_threshold: 0.5      # largest-cluster point-ratio threshold
  update_size_threshold: 10  # batch plane re-fit trigger (new points per voxel); R-VoxelMap hardcodes 5 and never re-fits


# Pillar Voxel Redundant Detection

pillar_map:
  pillar_map_en: true

  voxel_size: 0.5
  pillar_buffer: 10  # n-frame pillar occupancy window; new-point detection starts at frame n+1 (n<=0: no reference kept, every point new)
  neighbor_ring_num: 1
  min_num: 5  # redundant voxel needs > this many points to confirm, isolated voxel needs < this
  height_consistency_ratio: 0.5  # ratio of voxel_size for height consistency check

  horizontal_redundant_threshold: 4
  vertical_redundant_threshold: 4   # z±1-shifted neighborhood slots for vertically-extended (sandwich) confirmation (ring_num=1: 8 slots)
  redundant_sample_en: false         # PRISM intra-voxel sampling of redundant voxels; overrides delete_redundant when on
  redundant_sample_ratio: 0.5        # per-voxel keep ratio (alpha)
  redundant_sample_min_pts: 10       # per-voxel floor; >= valid_check_min_points_size keeps the coplanar guard active
  redundant_sample_bin: 0.05         # radial shell width (m); shells get entropy-balanced quotas
  delete_redundant: true  # true=delete redundant points before they enter the voxel map, false=keep them

  adjacent_isolated_threshold: 2
  delete_isolated: true  # true=delete isolated points before they enter the voxel map, false=keep them

  dyn_detect_en: true  # mark points whose pillar voxel was unseen in the last n frames; publish to /cloud_pillarmap (REQUIRED for the dyn buffer: dyn_cluster_expansion / dyn_bridge_display)
  delete_dyn: true  # true=delete new points before they enter the voxel map, false=keep them
  dyn_cluster_en: true  # cluster candidate new points; scattered singletons are downgraded to normal
  dyn_cluster_min_num: 10  # min points per cluster to confirm as new (sparse clouds: start small, 3-5)
  dyn_cluster_expansion: true  # rescue sweep: pool current-frame points sitting in recent dyn-buffer voxels into the cluster (needs dyn_cluster_en + dyn_buffer_max_age > 0)
  dyn_buffer_max_age: 5  # dyn-buffer voxel freshness window: buffer aging + rescue-pooling horizon (0 = buffer off; dyn_bridge_display needs > 0)
  dyn_bridge_display: false  # display-only bridge: re-publish stale points of intermittently detected targets, red (needs dyn_buffer_max_age > 0)

local_map:
  map_sliding_en: false
  half_map_size: 1000
  sliding_thresh: 8

uav:
  imu_rate_odom: true
  gravity_align_en: true

publish:
  dense_map_en: true
  pub_effect_en: false
  pub_plane_en: false
  pub_body_en: false

evo:
  seq_name: "result"
  pose_output_en: true
  pose_output_dir: "/home/wsl-4080/code/traj_evo/pred/voxel-pillar/"

lidar_save:
  save_en: false
  save_dir: ""  # PCD output dir; per-run <timestamp>/ subdir is created inside; empty = Log/PCD/<timestamp> under package root
  save_laz: false  # false = save .las, true = save compressed .laz; replaces the .pcd output
  filter_size_pcd: 0.15
  interval: 1

external_imu:
  enable: false
  time_offset: 0
  buffer_size: 100000
  external_R: [0, 0, -1, 1, 0, 0, 0, -1, 0]
  external_T: [0, 0, 0]
  external_imu_only: false

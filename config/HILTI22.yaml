common:
  lid_topic: "/hesai/pandar"
  imu_topic: "/alphasense/imu"
  lidar_en: 1
  ros_driver_bug_fix: false

extrin_calib:
  # Hilti-2022
  extrinsic_T: [-0.001, -0.00855, 0.055]
  extrinsic_R: [0, -1, 0, -1, 0, 0, 0, 0, -1]

  # Hilti-2023
  # extrinsic_T: [-0.006730146149038548, -0.006897049862999071, 0.049898628062256645]
  # extrinsic_R: [0.006609639848469365, -0.9999773650294649, 0.0012578115132016717,
  #               -0.9999762249571927, -0.006612093869054189, -0.0019569708811106104,
  #               0.001965243352927244, -0.0012448467359610184, -0.9999972940839232]

time_offset:
  imu_time_offset: 0.0

preprocess:
  point_filter_num: 10
  filter_size_surf: 0.1
  lidar_type: 5  # HesaiXT32
  scan_line: 32
  blind: 0.6

imu:
  imu_en: true
  imu_int_frame: 50
  # acc_cov: 0.5
  # gyr_cov: 0.01
  # b_acc_cov: 0.0001
  # b_gyr_cov: 0.0001

  # exp03
  # acc_cov: 0.5
  # gyr_cov: 0.5
  # b_acc_cov: 0.0001
  # b_gyr_cov: 0.0001

  # exp10
  acc_cov: 0.5
  gyr_cov: 0.01
  b_acc_cov: 0.0001
  b_gyr_cov: 0.0001

lio:
  max_iterations: 5
  dept_err: 0.02
  beam_err: 0.05
  min_eigen_value: 0.0001
  voxel_size: 0.5
  max_layer: 2
  max_points_num: 100
  layer_init_num: [5, 5, 5, 5, 5]
  capacity: 0  # LRU cache (0 = disable)
  intensity_fusion_en: true
  intensity_gate_en: false  # Intensity-based association gate (reject material-inconsistent matches)
  intensity_gate_k: 3.0     # Gate threshold in units of intensity sigma
  intensity_noise_est_en: true  # Online estimation of intensity measurement noise (init window)
  intensity_ema_alpha: 0.5      # EMA adaptation rate of plane intensity stats, in (0,1]; higher = faster

# Pillar Voxel Redundant Detection
pillar_voxel:
  pillar_voxel_en: true
  voxel_size: 0.5

  redundant_detection_method: 1  # 0=none (isolated points only), 1=neighborhood redundant detection
  redundant_neighbor_type: 0  # 0=4-neighbor, 1=8-neighbor
  adjacent_redundant_threshold: 4

  isolated_neighbor_type: 1  # 0=4-neighbor, 1=8-neighbor
  adjacent_isolated_threshold: 3

  height_consistency_ratio: 0.25  # ratio of voxel_size for height consistency check

  keep_num_per_voxel: 5  # 0=skip all points, n=keep n newest points per voxel
  keep_redundant: true
  keep_isolated: false

local_map:
  map_sliding_en: false
  half_map_size: 1000
  sliding_thresh: 8

uav:
  imu_rate_odom: true
  gravity_align_en: true

publish:
  dense_map_en: false
  pub_effect_en: false
  pub_plane_en: false
  pub_body_en: false

evo:
  seq_name: "result"
  pose_output_en: true
  pose_output_dir: "/home/wsl-4080/code/traj_evo/pred/voxel-pillar/"

lidar_save:
  save_en: false
  filter_size_pcd: 0.15
  interval: 1

external_imu:
  enable: false
  time_offset: 0
  buffer_size: 100000
  external_R: [0, 0, -1, 1, 0, 0, 0, -1, 0]
  external_T: [0, 0, 0]
  external_imu_only: false

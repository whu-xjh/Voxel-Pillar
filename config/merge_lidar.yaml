common:
  lid_topic: "/livox/multi_lidar"
  imu_topic: "/livox/imu_192_168_1_159"
  external_imu_topic: "/novatel/oem7/odom"
  lidar_en: 1
  ros_driver_bug_fix: false

extrin_calib:
  extrinsic_T: [-0.011, -0.02329, 0.04412]
  extrinsic_R: [1, 0, 0, 0, 1, 0, 0, 0, 1]

time_offset:
  imu_time_offset: 0.0

preprocess:
  point_filter_num: 5
  filter_size_surf: 0.5
  lidar_type: 1  # Livox Avia
  scan_line: 6  # Avia: 6, Mid360: 4
  blind: 0.8

# IMU
imu:
  imu_en: true
  imu_int_frame: 30
  acc_cov: 0.5
  gyr_cov: 0.3
  b_acc_cov: 0.0001
  b_gyr_cov: 0.0001

# LiDAR-Inertial Odometry
lio:
  max_iterations: 5
  dept_err: 0.02
  beam_err: 0.05
  min_eigen_value: 0.0025
  voxel_size: 1
  max_layer: 2
  max_points_num: 100
  layer_init_num: [5, 5, 5, 5, 5]

  # R-VoxelMap-style plane init refinements
  intensity_fusion_en: false
  intensity_fusion_weight: 0.5      # intensity trust weight in the joint association score exp(-(w_g*m_geo + w_i*m_int)); 0.5 = equal trust
  intensity_gate_en: false          # Intensity-based association gate (reject material-inconsistent matches)
  intensity_gate_k: 3.0             # Gate threshold in units of intensity sigma
  intensity_noise_est_en: false     # Online estimation of intensity measurement noise (init window)
  intensity_ema_alpha: 0.05          # EMA adaptation rate of plane intensity stats, in (0,1]; higher = faster
  intensity_angle_comp_en: false
  intensity_angle_exp: 1.0          # Lambertian exponent k (<=0 also disables)
  intensity_angle_cos_floor: 0.2    # cos clip floor vs grazing-angle blow-up
  intensity_angle_debug_en: false   # dump matched (intensity, gain) pairs for validation
  degeneracy_adaptive_en: true      # engage intensity fusion only in degenerate scenes (requires intensity_fusion_en)
  degeneracy_on_threshold: 0.005      # enter degenerate mode when lambda_min/lambda_max < this
  degeneracy_off_threshold: 0.1     # exit hysteresis threshold; must be > on
  degeneracy_min_frames: 1          # consecutive frames to switch state (debounce) 

  # R-VoxelMap-style plane init refinements
  plane_refine_en: false
  init_distance_threshold: 0.1      # init_plane: drop points farther than this from the first PCA fit (m)
  plane_valid_check_en: true        # coplanar-disjoint-surface guard (2D grid DFS clustering)
  valid_check_max_layer: 0          # run the guard only on layers with index <= this (0 = root voxel only)
  valid_check_min_points_size: 10   # min retained points to run the guard
  valid_check_resolution: 4         # projection grid resolution factor
  valid_check_p_threshold: 0.6      # largest-cluster point-ratio threshold

# Pillar Voxel Redundant Detection
pillar_map:
  pillar_map_en: false
  voxel_size: 0.5
  pillar_buffer: 1                  # n-frame pillar occupancy window; new-point detection starts at frame n+1 (n<=0: no reference kept, every point new)
  neighbor_ring_num: 1
  min_num: 10                        # redundant voxel needs > this many points to confirm, isolated voxel needs < this
  height_consistency_ratio: 0.5    # ratio of voxel_size for height consistency check

  horizontal_redundant_threshold: 4
  vertical_redundant_threshold: 2        # z±1-shifted neighborhood slots for vertically-extended (sandwich) confirmation (ring_num=1: 8 slots)
  redundant_sample_en: true          # PRISM intra-voxel sampling of redundant voxels; overrides delete_redundant when on
  redundant_sample_ratio: 0.2        # per-voxel keep ratio (alpha)
  redundant_sample_min_pts: 10       # per-voxel floor; >= valid_check_min_points_size keeps the coplanar guard active
  redundant_sample_bin: 0.1         # radial shell width (m); shells get entropy-balanced quotas
  delete_redundant: false

  adjacent_isolated_threshold: 3
  delete_isolated: true             # true=delete isolated points before they enter the voxel map, false=keep them

  dyn_detect_en: false              # mark points whose pillar voxel was unseen in the last n frames; publish to /cloud_pillarmap
  delete_dyn: true                  # true=delete new points before they enter the voxel map, false=keep them
  dyn_cluster_en: true              # cluster candidate new points; scattered singletons are downgraded to normal
  dyn_cluster_min_num: 5            # min points per cluster to confirm as new (sparse clouds: start small, 3-5)
  dyn_cluster_expansion: false      # rescue sweep pooling recent dyn-buffer voxels into the cluster (requires dyn_detect_en + dyn_cluster_en + dyn_buffer_max_age > 0)
  dyn_buffer_max_age: 3             # dyn-buffer voxel freshness window: buffer aging + rescue-pooling horizon (0 = buffer off; dyn_bridge_display needs > 0)
  dyn_bridge_display: false         # display-only bridge: re-publish stale points of intermittently detected targets, red (needs dyn_buffer_max_age > 0)
 
local_map:
  map_sliding_en: false
  half_map_size: 1000
  sliding_thresh: 8

uav:
  imu_rate_odom: true
  gravity_align_en: true

publish:
  dense_map_en: true
  pub_effect_en: false
  pub_plane_en: false
  pub_body_en: false

evo:
  seq_name: "shawan_tunnel"
  pose_output_en: false
  pose_output_dir: ""

lidar_save:
  save_en: false
  save_dir: ""  # PCD output dir; per-run <timestamp>/ subdir is created inside; empty = Log/PCD/<timestamp> under package root
  save_laz: false  # false = save .las, true = save compressed .laz; replaces the .pcd output
  filter_size_pcd: 0.10
  interval: 100

external_imu:
  enable: true
  external_imu_init_frame: 50
  time_offset: 0
  buffer_size: 100000
  external_R: [0, 0, -1, 1, 0, 0, 0, -1, 0]
  external_T: [0, 0, 0]
  external_imu_only: true

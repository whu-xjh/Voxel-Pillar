common:
  lid_topic: "/os1_cloud_node1/points"
  imu_topic: "/imu/imu"
  lidar_en: 1
  ros_driver_bug_fix: false

extrin_calib:
  extrinsic_T: [-0.050, 0.000, 0.055]
  extrinsic_R: [1, 0, 0, 0, 1, 0, 0, 0, 1]

time_offset:
  lidar_time_offset: -0.1
  imu_time_offset: 0.0

preprocess:
  point_filter_num: 1
  filter_size_surf: 0.1
  lidar_type: 3  # Ouster
  scan_line: 16
  blind: 1.0

imu:
  imu_en: true
  imu_int_frame: 30
  acc_cov: 0.5
  gyr_cov: 0.3
  b_acc_cov: 0.0001
  b_gyr_cov: 0.0001

lio:
  max_iterations: 5
  dept_err: 0.02
  beam_err: 0.01
  min_eigen_value: 0.0025
  voxel_size: 0.5
  max_layer: 2
  max_points_num: 50
  layer_init_num: [5, 5, 5, 5, 5]
  capacity: 0  # LRU cache (0 = disable)
  intensity_fusion_en: true
  intensity_gate_en: false  # Intensity-based association gate (reject material-inconsistent matches)
  intensity_gate_k: 3.0     # Gate threshold in units of intensity sigma
  intensity_noise_est_en: true  # Online estimation of intensity measurement noise (init window)
  intensity_ema_alpha: 0.5      # EMA adaptation rate of plane intensity stats, in (0,1]; higher = faster

# Pillar Voxel Redundant Detection
pillar_voxel:
  pillar_voxel_en: true
  voxel_size: 1.0

  adjacent_redundant_threshold: 1
  keep_num_per_voxel: 1  # 0=skip all redundant points, n=keep n newest points per redundant voxel
  keep_redundant: true
  keep_isolated: false

  adjacent_isolated_threshold: 1

  height_consistency_ratio: 0.25  # ratio of voxel_size for height consistency check

local_map:
  map_sliding_en: false
  half_map_size: 100
  sliding_thresh: 8

uav:
  imu_rate_odom: true
  gravity_align_en: true

publish:
  dense_map_en: false
  pub_effect_en: false
  pub_plane_en: false
  pub_body_en: false

evo:
  seq_name: "nya_03"
  pose_output_en: true
  pose_output_dir: ""

lidar_save:
  save_en: false
  filter_size_pcd: 0.15
  interval: -1  # -1 = save all in one file (memory risk)

external_imu:
  enable: false
  time_offset: 0
  buffer_size: 100000
  external_R: [0, 0, -1, 1, 0, 0, 0, -1, 0]
  external_T: [0, 0, 0]
  external_imu_only: false

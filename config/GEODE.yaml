# ===================================================================
# GEODE Livox Avia Dataset Configuration
# ===================================================================
# 本配置文件适用于GEODE数据集的Livox Avia场景
#
# 数据集列表:
# 1. Shield_tunnel1_gamma.bag   - 盾构隧道 (4.2GB, 542秒)
# 2. Tunneling_tunnel1_gamma.bag - 掘进隧道 (1.7GB, 208秒)
#
# 使用方法:
# 1. 根据数据集修改下方 evo/seq_name 参数
# 2. 运行: roslaunch voxel_pillar mapping_geode.launch
# 3. 播放bag: rosbag play /home/wsl-4080/data/geode/[对应bag文件]
#
# 数据集环境差异:
# - Shield_Tunnel: 盾构机施工隧道，圆形截面，特征相对单一
# - Tunneling_Tunnel: 掘进机施工隧道，环境更加复杂
# ===================================================================

common:
  lid_topic: "/livox/lidar"
  imu_topic: "/imu/data"
  lidar_en: 1
  ros_driver_bug_fix: false

extrin_calib:
  # LiDAR to IMU extrinsic (from gamma_config.yaml T_IMU_LiDAR)
  # Rotation matrix (3x3) flattened:
  # [0.999620,  0.027463,  0.002445]
  # [-0.027517,  0.999299,  0.025398]
  # [-0.001746, -0.025456,  0.999674]
  extrinsic_R: [0.999620, 0.027463, 0.002445,
                -0.027517, 0.999299, 0.025398,
                -0.001746, -0.025456, 0.999674]

  # Translation: [0.049258, -0.012500, 0.026946]
  extrinsic_T: [0.049258, -0.012500, 0.026946]

time_offset:
  imu_time_offset: 0.0

preprocess:
  point_filter_num: 1
  filter_size_surf: 0.5
  lidar_type: 1  # Livox Avia
  scan_line: 6   # Livox Avia: 6 lines
  blind: 0.8
  # === 不同数据集的参数建议 ===
  # Shield_Tunnel:    blind=0.3 (盾构隧道)
  # Tunneling_Tunnel: blind=0.8 (掘进隧道，环境更复杂)

# IMU
imu:
  imu_en: true
  imu_int_frame: 30
  acc_cov: 0.5
  gyr_cov: 0.3
  b_acc_cov: 0.0001
  b_gyr_cov: 0.0001

# LiDAR-Inertial Odometry
lio:
  max_iterations: 10
  dept_err: 0.02
  beam_err: 0.05
  min_eigen_value: 0.0025
  voxel_size: 1
  max_layer: 2
  max_points_num: 100
  layer_init_num: [5, 5, 5, 5, 5]
  sigma_num: 3
  capacity: 0  # LRU cache (0 = disable)

intensity_fusion:
  intensity_fusion_en: false
  intensity_fusion_weight: 0.8      # constant intensity trust weight in the joint score exp(-(w_g*m_geo + w_i*m_int)) when degeneracy_adaptive_en is false
  intensity_ema_alpha: 0.5          # EMA adaptation rate of plane intensity stats, in (0,1]; higher = faster
  intensity_gate_en: false          # Intensity-based association gate (reject material-inconsistent matches)
  intensity_gate_k: 3.0             # Gate threshold in units of intensity sigma

degeneracy_adaptive:
  degeneracy_adaptive_en: false
  degeneracy_on_threshold: 0.1      # ramp lower endpoint on lambda_min/lambda_max: at or below this w_i = w_max
  degeneracy_off_threshold: 0.2     # ramp upper endpoint: at or above this w_i = w_min; must be > on
  degeneracy_weight_min: 0.0        # intensity trust floor when geometry is healthy (0 = geometry-only scoring)
  degeneracy_weight_max: 0.8        # intensity trust ceiling when fully degenerate
  degeneracy_weight_ema_alpha: 0.5  # EMA rate of the degeneracy ramp d, in (0,1]; higher = faster tracking

plane_refine_en:
  plane_refine_en: true
  init_distance_threshold: 0.1      # init_plane: drop points farther than this from the first PCA fit (m)
  intensity_filter_en: false        # MAD gate at first init + EMA σ gate at insertion (requires plane_refine_en: true)
  intensity_filter_sigma_k: 3.0     # outlier threshold in σ units, shared by both phases
  intensity_filter_min_points: 5    # gate skipped below this many points (small-sample stats noisy)
  plane_valid_check_en: true        # coplanar-disjoint-surface guard (2D grid DFS clustering)
  valid_check_max_layer: 0          # run the guard only on layers with index <= this (0 = root voxel only)
  valid_check_min_points_size: 10   # min retained points to run the guard
  valid_check_resolution: 4         # projection grid resolution factor
  valid_check_p_threshold: 0.5      # largest-cluster point-ratio threshold
  update_size_threshold: 10  # batch plane re-fit trigger (new points per voxel); R-VoxelMap hardcodes 5 and never re-fits


# Pillar Voxel Redundant Detection

pillar_map:
  pillar_map_en: true
  voxel_size: 0.5
  pillar_buffer: 5  # n-frame pillar occupancy window; new-point detection starts at frame n+1 (n<=0: no reference kept, every point new)
  neighbor_ring_num: 1
  min_num: 5  # redundant voxel needs > this many points to confirm, isolated voxel needs < this
  height_consistency_ratio: 0.25  # ratio of voxel_size for height consistency check

  horizontal_redundant_threshold: 4
  vertical_redundant_threshold: 4   # z±1-shifted neighborhood slots for vertically-extended (sandwich) confirmation (ring_num=1: 8 slots)
  redundant_sample_en: false         # PRISM intra-voxel sampling of redundant voxels; overrides delete_redundant when on
  redundant_sample_ratio: 0.5        # per-voxel keep ratio (alpha)
  redundant_sample_min_pts: 10       # per-voxel floor; >= valid_check_min_points_size keeps the coplanar guard active
  redundant_sample_bin: 0.05         # radial shell width (m); shells get entropy-balanced quotas
  keep_redundant: false

  adjacent_isolated_threshold: 3

  dyn_detect_en: false  # mark points whose pillar voxel was unseen in the last n frames; publish to /cloud_pillarmap
  dyn_cluster_en: true  # cluster candidate new points; scattered singletons are downgraded to normal
  dyn_cluster_min_num: 3  # min points per cluster to confirm as new (sparse clouds: start small, 3-5)
local_map:
  map_sliding_en: false
  half_map_size: 1000
  sliding_thresh: 8

uav:
  imu_rate_odom: true
  gravity_align_en: true

publish:
  dense_map_en: true
  pub_effect_en: true
  pub_plane_en: false
  pub_body_en: false

evo:
  # === 选择对应的数据集序列名称 ===
  # Shield_Tunnel:    seq_name: "shield_tunnel1"
  # Tunneling_Tunnel: seq_name: "tunneling_tunnel1"
  seq_name: "tunneling_tunnel2"
  pose_output_en: true
  pose_output_dir: ""

lidar_save:
  save_en: false
  save_dir: ""  # PCD output dir; per-run <timestamp>/ subdir is created inside; empty = Log/PCD/<timestamp> under package root
  save_laz: false  # false = save .las, true = save compressed .laz; replaces the .pcd output
  filter_size_pcd: 0.15
  interval: -1  # -1 = save all in one file (memory risk)

external_imu:
  enable: false
  external_imu_init_frame: 30
  time_offset: 0
  buffer_size: 100000
  external_R: [0, 0, -1, 1, 0, 0, 0, -1, 0]
  external_T: [0, 0, 0]
  external_imu_only: false
# ===================================================================
# GEODE Livox Avia Dataset Configuration
# ===================================================================
# 本配置文件适用于GEODE数据集的Livox Avia场景
#
# 数据集列表:
# 1. Shield_tunnel1_gamma.bag   - 盾构隧道 (4.2GB, 542秒)
# 2. Tunneling_tunnel1_gamma.bag - 掘进隧道 (1.7GB, 208秒)
#
# 使用方法:
# 1. 根据数据集修改下方 evo/seq_name 参数
# 2. 运行: roslaunch voxel_pillar mapping_geode.launch
# 3. 播放bag: rosbag play /home/wsl-4080/data/geode/[对应bag文件]
#
# 数据集环境差异:
# - Shield_Tunnel: 盾构机施工隧道，圆形截面，特征相对单一
# - Tunneling_Tunnel: 掘进机施工隧道，环境更加复杂
# ===================================================================

common:
  lid_topic: "/livox/lidar"
  imu_topic: "/imu/data"
  lidar_en: 1
  ros_driver_bug_fix: false

extrin_calib:
  # LiDAR to IMU extrinsic (from gamma_config.yaml T_IMU_LiDAR)
  # Rotation matrix (3x3) flattened:
  # [0.999620,  0.027463,  0.002445]
  # [-0.027517,  0.999299,  0.025398]
  # [-0.001746, -0.025456,  0.999674]
  extrinsic_R: [0.999620, 0.027463, 0.002445,
                -0.027517, 0.999299, 0.025398,
                -0.001746, -0.025456, 0.999674]

  # Translation: [0.049258, -0.012500, 0.026946]
  extrinsic_T: [0.049258, -0.012500, 0.026946]

time_offset:
  imu_time_offset: 0.0

preprocess:
  point_filter_num: 1
  filter_size_surf: 0.5
  lidar_type: 1  # Livox Avia
  scan_line: 6   # Livox Avia: 6 lines
  blind: 0.8
  # === 不同数据集的参数建议 ===
  # Shield_Tunnel:    blind=0.3 (盾构隧道)
  # Tunneling_Tunnel: blind=0.8 (掘进隧道，环境更复杂)

# IMU
imu:
  imu_en: true
  imu_int_frame: 30
  acc_cov: 0.5
  gyr_cov: 0.3
  b_acc_cov: 0.0001
  b_gyr_cov: 0.0001

# LiDAR-Inertial Odometry
lio:
  max_iterations: 10
  dept_err: 0.02
  beam_err: 0.05
  min_eigen_value: 0.0025
  voxel_size: 1
  max_layer: 2
  max_points_num: 100
  layer_init_num: [5, 5, 5, 5, 5]
  valid_check_p_threshold: 0.5
  valid_check_resolution: 4
  valid_check_min_points_size: 10
  valid_check_max_layer: 0
  plane_valid_check_en: true
  init_distance_threshold: 0.1
  plane_refine_en: true
  sigma_num: 3
  capacity: 0  # LRU cache (0 = disable)
  intensity_fusion_en: false
  intensity_gate_en: false  # Intensity-based association gate (reject material-inconsistent matches)
  intensity_gate_k: 3.0     # Gate threshold in units of intensity sigma
  intensity_noise_est_en: true  # Online estimation of intensity measurement noise (init window)
  intensity_ema_alpha: 0.5      # EMA adaptation rate of plane intensity stats, in (0,1]; higher = faster

# Pillar Voxel Redundant Detection
pillar_map:
  pillar_map_en: true
  voxel_size: 0.5
  history_frame_num: 5  # history reference frame count n; detection starts at frame n+1 (n<=0: no reference kept, every point new)
  neighbor_ring_num: 1
  keep_num_per_voxel: 1  # 0=skip all points, n=keep n newest points per voxel
  min_num: 5  # redundant voxel needs > this many points to confirm, isolated voxel needs < this
  height_consistency_ratio: 0.25  # ratio of voxel_size for height consistency check

  adjacent_redundant_threshold: 4
  keep_redundant: false

  adjacent_isolated_threshold: 3
  keep_isolated: false

  dyn_detect_en: false  # mark points whose pillar voxel was unseen in the last n frames; publish to /cloud_pillarmap
  adjacent_dyn_threshold: 3  # candidate new voxel confirmed only if same-layer occupied neighbors < this (0=check off)
  keep_dyn: false  # true=apply keep_num_per_voxel retention to new voxels, false=skip all new points
  dyn_cluster_en: true  # cluster candidate new points; scattered singletons are downgraded to normal
  dyn_cluster_min_num: 3  # min points per cluster to confirm as new (sparse clouds: start small, 3-5)
  dyn_flat_filter_en: true  # reject clusters fitting in a thin slab along any coordinate axis (only 3D blobs survive)
  dyn_flat_band: 0.1  # max per-axis extent to count as flat; keep < narrow-target depth (~0.3m); over-large band silences all output
local_map:
  map_sliding_en: false
  half_map_size: 1000
  sliding_thresh: 8

uav:
  imu_rate_odom: true
  gravity_align_en: true

publish:
  dense_map_en: true
  pub_effect_en: true
  pub_plane_en: false
  pub_body_en: false

evo:
  # === 选择对应的数据集序列名称 ===
  # Shield_Tunnel:    seq_name: "shield_tunnel1"
  # Tunneling_Tunnel: seq_name: "tunneling_tunnel1"
  seq_name: "tunneling_tunnel2"
  pose_output_en: true
  pose_output_dir: ""

lidar_save:
  save_en: false
  filter_size_pcd: 0.15
  interval: -1  # -1 = save all in one file (memory risk)

external_imu:
  enable: false
  external_imu_init_frame: 30
  time_offset: 0
  buffer_size: 100000
  external_R: [0, 0, -1, 1, 0, 0, 0, -1, 0]
  external_T: [0, 0, 0]
  external_imu_only: false
common:
  lid_topic: "/velodyne_points"
  imu_topic: "/imu/data"
  lidar_en: 1
  ros_driver_bug_fix: false

extrin_calib:
  # LiDAR to IMU extrinsic
  # Cave: extrinsic_T: [0.080, 0.029, 0.030]
  # Corridor: extrinsic_R: [0.999954875339377, 0.0, 0.009499857104811, 0.0, 1.0, 0.0, -0.009499857104811, 0.0, 0.999954875339377]

  # Laurel_Cavern, cave
  extrinsic_T: [0.080, 0.029, 0.030]
  extrinsic_R: [1, 0, 0, 0, 1, 0, 0, 0, 1]

  # Final_Challenge, Urban_Challenge
  # extrinsic_T: [0.0, 0.0, 0.0]
  # extrinsic_R: [1, 0, 0, 0, 1, 0, 0, 0, 1]

  # Corridor01
  # extrinsic_T: [0.080, 0.029, 0.030]
  # extrinsic_R: [0.9992129, -0.000519121,  0.004, 0.000516111,  0.999218492, -0.000939132, -0.004,  0.000802565,  0.999993652]

  # Corridor02
  # extrinsic_T: [0.0, 0.0, 0.0]
  # extrinsic_R: [0.999954875339377, 0.0000000, 0.009499857104811, 0.0000000, 1.0000000, 0.0000000, -0.009499857104811, 0.0000000, 0.999954875339377]

  # Floor
  # extrinsic_T: [0.080, 0.029, 0.030]
  # extrinsic_R: [0.999945562, 0.009074807,  0.005149763, -0.009060897, 0.999955255, -0.002718066, -0.005174199, 0.002671256,  0.999983046]

time_offset:
  imu_time_offset: 0.1

preprocess:
  point_filter_num: 5
  filter_size_surf: 0.1
  lidar_type: 2  # Velodyne
  scan_line: 16
  blind: 0.4

# IMU
imu:
  imu_en: true
  imu_int_frame: 30

  # standard setting
  acc_cov: 0.1
  gyr_cov: 0.1
  b_acc_cov: 0.0001
  b_gyr_cov: 0.0001

  # Long_Corridor
  # acc_cov: 0.2
  # gyr_cov: 1.0
  # b_acc_cov: 0.0001
  # b_gyr_cov: 0.0001

  # Multi_Floor
  # acc_cov: 0.3
  # gyr_cov: 0.1
  # b_acc_cov: 0.0001
  # b_gyr_cov: 0.0001

  # Final_Challenge, Urban_Challenge
  # acc_cov: 0.2
  # gyr_cov: 0.05
  # b_acc_cov: 0.00005
  # b_gyr_cov: 0.00005

  # cave04
  # acc_cov: 1.0
  # gyr_cov: 0.1
  # b_acc_cov: 0.0001
  # b_gyr_cov: 0.0001

# LiDAR-Inertial Odometry
lio:
  max_iterations: 5
  dept_err: 0.03
  beam_err: 0.05
  min_eigen_value: 0.0025
  voxel_size: 0.5
  max_layer: 1
  max_points_num: 100 
  layer_init_num: [5, 5, 5, 5, 5]
  sigma_num: 3
  capacity: 0  # LRU cache (0 = disable)
  intensity_fusion_en: true
  intensity_gate_en: false  # Intensity-based association gate (reject material-inconsistent matches)
  intensity_gate_k: 3.0     # Gate threshold in units of intensity sigma
  intensity_noise_est_en: true  # Online estimation of intensity measurement noise (init window)
  intensity_ema_alpha: 0.5      # EMA adaptation rate of plane intensity stats, in (0,1]; higher = faster
 
 # R-VoxelMap-style plane init refinements
  plane_refine_en: true
  init_distance_threshold: 0.1      # init_plane: drop points farther than this from the first PCA fit (m)
  plane_valid_check_en: true        # coplanar-disjoint-surface guard (2D grid DFS clustering)
  valid_check_max_layer: 0          # run the guard only on voxels at/above this layer
  valid_check_min_points_size: 10   # min retained points to run the guard
  valid_check_resolution: 4         # projection grid resolution factor
  valid_check_p_threshold: 0.5      # largest-cluster point-ratio threshold

# Pillar Voxel Redundant Detection
pillar_voxel:
  pillar_voxel_en: false
  voxel_size: 0.5
  history_frame_num: 5  # history reference frame count n; detection starts at frame n+1 (n<=0: no reference kept, every point new)
  neighbor_ring_num: 1
  keep_num_per_voxel: 1  # 0=skip all points, n=keep n newest points per voxel
  min_num: 5  # redundant voxel needs > this many points to confirm, isolated voxel needs < this
  height_consistency_ratio: 0.25  # ratio of voxel_size for height consistency check

  adjacent_redundant_threshold: 4
  keep_redundant: false

  adjacent_isolated_threshold: 3
  keep_isolated: false

  new_point_detect_en: false  # mark points whose pillar voxel was unseen in the last n frames; publish to /cloud_pillarmap
  adjacent_new_point_threshold: 3  # candidate new voxel confirmed only if same-layer occupied neighbors < this (0=check off)
  keep_new_point: false  # true=apply keep_num_per_voxel retention to new voxels, false=skip all new points
  new_point_cluster_en: true  # cluster candidate new points; scattered singletons are downgraded to normal
  new_point_cluster_min_num: 3  # min points per cluster to confirm as new (sparse clouds: start small, 3-5)
  new_point_flat_filter_en: true  # reject clusters fitting in a thin slab along any coordinate axis (only 3D blobs survive)
  new_point_flat_band: 0.1  # max per-axis extent to count as flat; keep < narrow-target depth (~0.3m); over-large band silences all output

local_map:
  map_sliding_en: false
  half_map_size: 1000
  sliding_thresh: 8

uav:
  imu_rate_odom: true
  gravity_align_en: true

publish:
  dense_map_en: false
  pub_effect_en: true
  pub_plane_en: false
  pub_body_en: false

evo:
  seq_name: "result"
  pose_output_en: true
  pose_output_dir: "/home/wsl-4080/code/traj_evo/pred/voxel-pillar/"

lidar_save:
  save_en: false
  filter_size_pcd: 0.15
  interval: -1  # -1 = save all in one file (memory risk)

external_imu:
  enable: false
  external_imu_init_frame: 30
  time_offset: 0
  buffer_size: 100000
  external_R: [0, 0, -1, 1, 0, 0, 0, -1, 0]
  external_T: [0, 0, 0]
  external_imu_only: false

common:
  lid_topic: "/livox/lidar"
  imu_topic: "/livox/imu"
  lidar_en: 1
  ros_driver_bug_fix: false

extrin_calib:
  extrinsic_T: [0.04165, 0.02326, -0.0284]
  extrinsic_R: [1, 0, 0, 0, 1, 0, 0, 0, 1]

time_offset:
  imu_time_offset: 0.0

preprocess:
  point_filter_num: 1
  filter_size_surf: 0.1
  lidar_type: 1 # Livox Avia LiDAR
  scan_line: 6
  blind: 0.8

imu:
  imu_en: true
  imu_int_frame: 30
  acc_cov: 2.0 # 0.5
  gyr_cov: 0.1 # 0.3
  b_acc_cov: 0.0001 # 0.1
  b_gyr_cov: 0.0001 # 0.1

lio:
  max_iterations: 5
  dept_err: 0.02
  beam_err: 0.05
  min_eigen_value: 0.005
  voxel_size: 2.0 # 1.0
  max_layer: 2
  max_points_num: 50
  layer_init_num: [5, 5, 5, 5, 5]

pillar_voxel:
  pillar_voxel_en: true
  voxel_size: 1.0

  redundant_neighbor_type: 1  # 0=4-neighbor, 1=8-neighbor
  adjacent_redundant_threshold: 3
  keep_num_per_voxel: 1  # 0=skip all redundant points, n=keep n newest points per redundant voxel
  keep_redundant: true
  keep_isolated: false

  isolated_neighbor_type: 1  # 0=4-neighbor, 1=8-neighbor
  adjacent_isolated_threshold: 3

  height_consistency_ratio: 0.25  # ratio of voxel_size for height consistency check

local_map:  
  map_sliding_en: false
  half_map_size: 100
  sliding_thresh: 8

uav:
  imu_rate_odom: false
  gravity_align_en: false

publish:
  dense_map_en: true
  pub_effect_en: false
  pub_plane_en: false

evo:
  seq_name: "HKisland03"
  pose_output_en: false
  pose_output_dir: ""

lidar_save:
  save_en: false
  filter_size_pcd: 0.15
  interval: -1
  # how many LiDAR frames saved in each pcd file;
  # -1 : all frames will be saved in ONE pcd file, may lead to memory crash when having too much frames.